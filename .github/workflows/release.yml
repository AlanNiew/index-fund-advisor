name: Release

# 只发 GitHub Release（本项目不发布到 PyPI）：
#   push tag v* -> 构建 wheel + sdist，冒烟测试后挂到 Release
#   workflow_dispatch -> 只构建并上传 workflow artifact，不发 Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} != pyproject version v{version}"
          print(f"tag {tag} matches pyproject version {version}")
          PY

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Smoke test the wheel
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          .smoke/bin/python -m pip install "${WHEEL}[mcp]"
          ls .smoke/bin/ifa .smoke/bin/ifa-mcp .smoke/bin/ifa-web
          .smoke/bin/ifa --help > /dev/null
          .smoke/bin/ifa tools --json > smoke_tools.json
          .smoke/bin/python -c "import json, pathlib; tools = json.loads(pathlib.Path('smoke_tools.json').read_text(encoding='utf-8')); assert len(tools) >= 30, tools; print(f'wheel smoke ok: {len(tools)} data tools')"
          .smoke/bin/python -c "import importlib.resources as r; p = r.files('ifa') / 'skills' / 'fund.md'; assert p.is_file(), p; print('bundled skill ok:', p)"
          .smoke/bin/python -c "import ifa.default_config, ifa.env_loader, ifa.providers; print('shared modules import ok')"
          .smoke/bin/python -c "import importlib.metadata as m; v = m.version('mcp'); assert v.split('.')[0] == '1', f'mcp extra 必须落在 1.x（2.x 移除了 FastMCP），实际 {v}'; print('mcp', v)"

      - name: Smoke test the MCP server (stdio handshake)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 60 .smoke/bin/ifa-mcp > smoke_mcp.json
          cat smoke_mcp.json
          grep -q "IFA - Index Fund Advisor" smoke_mcp.json
          echo "mcp stdio handshake ok"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
