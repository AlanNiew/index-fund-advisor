[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "index-fund-advisor"
version = "0.1.0"
description = "IFA: AI-Powered Index Fund Analysis and Portfolio Advisory"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AlanNiew", email = "728097735@qq.com" },
]
keywords = ["index-fund", "a-share", "akshare", "llm", "langgraph", "fund-analysis", "valuation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
dependencies = [
    # 数据
    "akshare>=1.18.49",
    "pandas>=2.3.0",
    "requests>=2.32.4",
    # LLM
    # 上限作为第二道防线（防止绕过 requirements.lock 拉到 breaking 大版本）；
    # 精确钉版见 requirements.lock（由 pip-compile 生成，CI/容器按锁安装）
    "langchain-core>=0.3.81,<2",
    "langchain-openai>=0.3.23,<2",
    "langchain-anthropic>=0.3.15,<2",
    "langchain-google-genai>=2.1.5,<3",
    "langgraph>=0.4.8,<2",
    # Agent
    "rank-bm25>=0.2.2",
    # CLI
    "typer>=0.21.0",
    "rich>=14.0.0",
    # API
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # Web
    "streamlit>=1.45",
    "plotly>=6.0",
    # 类型
    "typing-extensions>=4.14.0",
]

[project.scripts]
ifa = "ifa.cli.main:app"
ifa-web = "ifa.cli.web_entry:main"
ifa-mcp = "ifa.mcp.server:main"

[project.urls]
Homepage = "https://github.com/AlanNiew/index-fund-advisor"
Repository = "https://github.com/AlanNiew/index-fund-advisor"
Issues = "https://github.com/AlanNiew/index-fund-advisor/issues"
Documentation = "https://github.com/AlanNiew/index-fund-advisor/blob/main/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.11",
    "mypy>=1.15",
    "pre-commit>=4.0",
]
mcp = [
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ifa*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "F403", "F405", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["ifa", "api", "web"]

[tool.mypy]
# 基线跟随 requires-python（>=3.12）：mypy 能解析 numpy/pandas 存根的 PEP 695 语法，
# 同时在解析阶段就会拦住 3.13+ 专属 API（例如 Path.read_text(newline=)，
# mypy 已借此发现过真问题）。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
