[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "index-fund-advisor"
version = "0.1.0"
description = "IFA: AI-Powered Index Fund Analysis and Portfolio Advisory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 数据
    "akshare>=1.18.49",
    "pandas>=2.3.0",
    "stockstats>=0.6.5",
    "requests>=2.32.4",
    "pytz>=2025.2",
    # LLM
    # 上限作为第二道防线（防止绕过 requirements.lock 拉到 breaking 大版本）；
    # 精确钉版见 requirements.lock（由 pip-compile 生成，CI/容器按锁安装）
    "langchain-core>=0.3.81,<2",
    "langchain-openai>=0.3.23,<2",
    "langchain-anthropic>=0.3.15,<2",
    "langchain-google-genai>=2.1.5,<3",
    "langgraph>=0.4.8,<2",
    # Agent
    "rank-bm25>=0.2.2",
    # CLI
    "typer>=0.21.0",
    "rich>=14.0.0",
    "questionary>=2.1.0",
    # API
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # Web
    "streamlit>=1.45",
    "plotly>=6.0",
    # 类型
    "typing-extensions>=4.14.0",
]

[project.scripts]
ifa = "ifa.cli.main:app"
ifa-web = "ifa.cli.web_entry:main"
ifa-mcp = "ifa.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.11",
    "mypy>=1.15",
    "pre-commit>=4.0",
]
mcp = [
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ifa*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "F403", "F405", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["ifa", "api", "web"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# numpy>=2.4 / pandas 的存根使用了 PEP 695（`type X = ...`）语法，mypy 在
# python_version < 3.12 时会在**解析阶段**直接中止（"errors prevented further checking"），
# 使整个类型检查门静默失效。这里只对这两个第三方存根关闭 follow（它们退化为 Any），
# 保留 3.10 作为自身代码的语法/标准库基线——它仍能抓到 ifa 代码里的 3.11+ 专属用法
# （例如 datetime.UTC，mypy 已借此发现真问题）。
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
